<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ПНВ LIVE — Выбери стримера</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=PT+Sans:wght@400;700&display=swap');

:root {
  --red:   #D0021B;
  --blue:  #003DA5;
  --dark:  #08090e;
  --panel: #0f1018;
  --card:  #12141e;
  --border:#1c1f2e;
  --glow:  rgba(208,2,27,0.3);
  --text:  #f0f2f8;
  --muted: #6a738a;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--dark); color: var(--text); font-family: 'PT Sans', sans-serif; min-height: 100vh; overflow-x: hidden; }

body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 70% 35% at 85% 5%, rgba(0,61,165,.14) 0%, transparent 55%),
    radial-gradient(ellipse 55% 45% at 5% 90%, rgba(208,2,27,.10) 0%, transparent 55%);
  pointer-events: none; z-index: 0;
}

/* ===== TASS ===== */
.tass-strip {
  display: flex; align-items: center; gap: 9px;
  padding: 4px 12px;
  background: #fff;
  border-bottom: 1px solid #ddd;
  position: relative; z-index: 10;
}
.tass-logo {
  font-family: 'Oswald', sans-serif; font-size: 14px; font-weight: 700;
  letter-spacing: 3px; color: #111; border: 2px solid #111;
  padding: 1px 5px 0; line-height: 1.5; flex-shrink: 0;
}
.tass-desc { font-size: 7px; color: #666; text-transform: uppercase; letter-spacing: .7px; line-height: 1.3; }
.tass-right { margin-left: auto; font-family: 'Oswald', sans-serif; font-size: 10px; color: #111; letter-spacing: 1.5px; font-weight: 600; text-align: right; }

/* ===== HEADER ===== */
header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(6,7,12,.97);
  backdrop-filter: blur(12px);
  border-bottom: 2px solid var(--red);
  box-shadow: 0 2px 20px var(--glow);
}
.hdr {
  display: flex; align-items: center;
  padding: 9px 12px; gap: 10px;
}
.flag { display:flex; flex-direction:column; width:26px; height:18px; border-radius:2px; overflow:hidden; flex-shrink:0; }
.flag div { flex:1; }
.f1{background:#fff} .f2{background:#003DA5} .f3{background:#D0021B}

.brand { flex:1; min-width:0; }
.brand-row { display:flex; align-items:center; gap:7px; }
.live-badge {
  background:var(--red); color:#fff;
  font-family:'Oswald',sans-serif; font-size:9px; font-weight:600;
  letter-spacing:2px; padding:2px 6px 1px; border-radius:2px;
  animation: blink 1.4s ease-in-out infinite; flex-shrink:0;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.45} }
.brand-name { font-family:'Oswald',sans-serif; font-size:24px; font-weight:700; letter-spacing:4px; line-height:1; }
.brand-name em { color:var(--red); font-style:normal; }
.brand-sub { font-family:'Oswald',sans-serif; font-size:7.5px; letter-spacing:1.5px; color:var(--muted); text-transform:uppercase; margin-top:1px; }

.hdr-right { display:flex; flex-direction:column; align-items:flex-end; gap:2px; flex-shrink:0; }
.cnt-pill { font-family:'Oswald',sans-serif; font-size:12px; color:var(--muted); letter-spacing:1px; }
.cnt-pill strong { color:var(--red); }
.event-mini { font-size:8px; color:var(--muted); text-align:right; }

/* subtitle bar */
.sub-bar {
  padding: 5px 12px 7px;
  font-family: 'Oswald', sans-serif;
  font-size: 11px;
  letter-spacing: 1.5px;
  color: var(--muted);
  text-align: center;
  border-top: 1px solid var(--border);
}
.sub-bar span { color: var(--red); }

/* ===== GRID ===== */
#grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 3px;
  padding: 6px;
  position: relative; z-index: 1;
}

/* ===== CARD ===== */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 5px;
  overflow: hidden;
  position: relative;
  aspect-ratio: 9/16;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  cursor: pointer;
  transition: border-color .18s, transform .15s, box-shadow .18s;
  -webkit-tap-highlight-color: transparent;
}
.card:active { transform: scale(.94); }
.card:hover { border-color: var(--red); box-shadow: 0 0 10px var(--glow); }

/* animated scanlines */
.card::before {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(255,255,255,.012) 3px, rgba(255,255,255,.012) 4px);
  pointer-events: none; z-index: 1;
}

/* gradient bottom */
.card::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0; height: 55%;
  background: linear-gradient(to top, rgba(0,0,0,.85) 0%, transparent 100%);
  pointer-events: none; z-index: 2;
}

.card-twitch-icon {
  width: 24px; height: 24px; opacity: .2;
  transition: opacity .2s;
  position: relative; z-index: 3;
  margin-bottom: 5px;
  flex-shrink: 0;
}
.card:hover .card-twitch-icon { opacity: .55; }

.card-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--blue), var(--red));
  display: flex; align-items: center; justify-content: center;
  font-family: 'Oswald', sans-serif;
  font-size: 14px; font-weight: 700;
  color: #fff;
  position: relative; z-index: 3;
  margin-bottom: 5px;
  flex-shrink: 0;
  box-shadow: 0 0 12px var(--glow);
  transition: transform .2s;
}
.card:hover .card-avatar { transform: scale(1.08); }

.card-info {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 0 6px 7px;
  z-index: 3; text-align: center;
}
.card-name {
  font-family: 'Oswald', sans-serif;
  font-size: 9px; font-weight: 600;
  letter-spacing: 1px;
  color: #fff;
  line-height: 1.2;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-handle {
  font-size: 7.5px; color: var(--muted);
  letter-spacing: .5px; margin-top: 1px;
}

.card-soon {
  position: absolute; top: 5px; left: 50%; transform: translateX(-50%);
  background: rgba(208,2,27,.18);
  border: 1px solid rgba(208,2,27,.4);
  color: var(--red);
  font-family: 'Oswald', sans-serif;
  font-size: 7px; letter-spacing: 1.5px;
  padding: 2px 6px 1px; border-radius: 20px;
  white-space: nowrap; z-index: 4;
}

/* LIVE indicator on card */
.card-live-dot {
  position: absolute; top: 5px; right: 5px;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--red);
  animation: blink 1.2s infinite;
  z-index: 4;
}

/* ===== VIEWER OVERLAY ===== */
.viewer {
  display: none;
  position: fixed; inset: 0;
  background: #000;
  z-index: 300;
  flex-direction: column;
}
.viewer.open { display: flex; }

.viewer-header {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: rgba(0,0,0,.9);
  border-bottom: 2px solid var(--red);
  flex-shrink: 0;
}
.viewer-back {
  background: var(--red); border: none; color: #fff;
  font-family: 'Oswald', sans-serif; font-size: 13px;
  font-weight: 600; letter-spacing: 1px;
  padding: 8px 14px; border-radius: 3px;
  cursor: pointer; white-space: nowrap;
  display: flex; align-items: center; gap: 5px;
}
.viewer-title {
  font-family: 'Oswald', sans-serif;
  font-size: 15px; font-weight: 700;
  letter-spacing: 2px; color: #fff;
  flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.viewer-subtitle { font-size: 10px; color: var(--muted); letter-spacing: 1px; }

.viewer-stream {
  flex: 1;
  display: flex; align-items: stretch; justify-content: center;
  background: #000;
  position: relative;
}
.viewer-stream iframe {
  width: 100%; height: 100%;
  border: none;
  display: block;
}

/* loader */
.viewer-loader {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 14px;
  background: #000;
  z-index: 2;
}
.loader-spin {
  width: 36px; height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--red);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loader-text {
  font-family: 'Oswald', sans-serif;
  font-size: 12px; letter-spacing: 2px; color: var(--muted);
}

.viewer-footer {
  background: rgba(0,0,0,.95);
  border-top: 1px solid var(--border);
  padding: 8px 12px;
  flex-shrink: 0;
}
.footer-label {
  font-family: 'Oswald', sans-serif;
  font-size: 9px; letter-spacing: 2px;
  color: var(--muted); text-align: center;
  margin-bottom: 7px; text-transform: uppercase;
}
.footer-row {
  display: flex; gap: 5px; overflow-x: auto; padding-bottom: 3px;
  scrollbar-width: none;
}
.footer-row::-webkit-scrollbar { display: none; }
.footer-chip {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 5px 10px;
  display: flex; flex-direction: column; align-items: center;
  cursor: pointer; flex-shrink: 0;
  transition: border-color .15s;
  min-width: 64px;
}
.footer-chip:hover, .footer-chip.active { border-color: var(--red); }
.footer-chip .fav { width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:8px;font-weight:700;color:#fff;margin-bottom:3px; background: linear-gradient(135deg,var(--blue),var(--red)); }
.footer-chip .fn { font-family:'Oswald',sans-serif;font-size:8px;letter-spacing:.8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58px; }

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--dark); }
::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }
</style>
</head>
<body>

<div class="tass-strip">
  <div class="tass-logo">ТАСС</div>
  <div class="tass-desc">Информационное<br>агентство России</div>
  <div class="tass-right">Лидеры<br>Нового Времени '26</div>
</div>

<header>
  <div class="hdr">
    <div class="flag"><div class="f1"></div><div class="f2"></div><div class="f3"></div></div>
    <div class="brand">
      <div class="brand-row">
        <div class="live-badge">LIVE</div>
        <div class="brand-name">П<em>Н</em>В</div>
      </div>
      <div class="brand-sub">Первый Национальный Стрим · 100 инфлюенсеров</div>
    </div>
    <div class="hdr-right">
      <div class="cnt-pill">стримов: <strong id="cnt">20</strong></div>
      <div class="event-mini">20 марта · 15:00–20:00</div>
    </div>
  </div>
  <div class="sub-bar">Нажми на стримера — <span>смотри в полный экран</span></div>
</header>

<!-- VIEWER -->
<div class="viewer" id="viewer">
  <div class="viewer-header">
    <button class="viewer-back" onclick="closeViewer()">← Назад</button>
    <div>
      <div class="viewer-title" id="vTitle">—</div>
      <div class="viewer-subtitle" id="vHandle">—</div>
    </div>
    <div class="live-badge" style="margin-left:auto">LIVE</div>
  </div>
  <div class="viewer-stream">
    <div class="viewer-loader" id="vLoader">
      <div class="loader-spin"></div>
      <div class="loader-text">ЗАГРУЗКА СТРИМА...</div>
    </div>
    <iframe id="vFrame" allowfullscreen allow="autoplay; fullscreen" style="display:none"></iframe>
  </div>
  <div class="viewer-footer">
    <div class="footer-label">другие стримеры</div>
    <div class="footer-row" id="footerRow"></div>
  </div>
</div>

<div id="grid"></div>

<script>
const STREAMERS = [
  { name: 'Братишкин',      handle: 'Bratishkinoff',    twitch: 'bratishkinoff' },
  { name: 'Сильвернейм',    handle: 'Silvername',       twitch: 'silvername' },
  { name: 'JesusAVGN',      handle: 'JesusAVGN',       twitch: 'jesusavgn' },
  { name: 'Сегалл',         handle: 'Segall',           twitch: 'segall' },
  { name: 'HardPlay',       handle: 'HardPlay',         twitch: 'hardplay' },
  { name: 'Артас',          handle: 'Arthas',           twitch: 'arthas' },
  { name: 'Ласка',          handle: 'Lasqa',            twitch: 'lasqa' },
  { name: 'Just_NS',        handle: 'Just_NS',          twitch: 'just_ns' },
  { name: 'Эвелон',         handle: 'Evelone192',       twitch: 'evelone192' },
  { name: 'C_a_k_e',        handle: 'C_a_k_e',          twitch: 'c_a_k_e' },
  { name: 'Мэддисон',       handle: 'Maddyson',         twitch: 'maddyson' },
  { name: 'Бастер',         handle: 'BusterShow',       twitch: 'buster' },
  { name: 'Welovegames',    handle: 'Welovegames',      twitch: 'welovegames' },
  { name: 'Пупок',          handle: 'Papich',           twitch: 'papich' },
  { name: 'Стрей228',       handle: 'Stray228',         twitch: 'stray228' },
  { name: 'Дрединг',        handle: 'Dreding',          twitch: 'dreding' },
  { name: 'Хани Мэйд',     handle: 'HoneyMaid',        twitch: 'honey_maid' },
  { name: 'RuHub',          handle: 'Dota2RuHub',       twitch: 'dota2ruhub' },
  { name: 'Лёха',           handle: 'Roadhouse',        twitch: 'roadhouse' },
  { name: 'Кейк',           handle: 'OverClockers',     twitch: 'overclockers1' },
];

const twitchSVG = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M11.64 5.93H13.07V10.21H11.64M15.57 5.93H17V10.21H15.57M7 2L3.43 5.57V18.43H7.71V22L11.29 18.43H14.14L20.57 12V2M19.14 11.29L16.29 14.14H13.43L10.93 16.64V14.14H7.71V3.43H19.14Z" fill="white"/>
</svg>`;

function initials(name) {
  return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
}

function buildGrid() {
  const g = document.getElementById('grid');
  g.innerHTML = '';
  STREAMERS.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      ${s.twitch ? '<div class="card-live-dot"></div>' : '<div class="card-soon">скоро в эфире</div>'}
      <div class="card-avatar">${initials(s.name)}</div>
      <svg class="card-twitch-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M11.64 5.93H13.07V10.21H11.64M15.57 5.93H17V10.21H15.57M7 2L3.43 5.57V18.43H7.71V22L11.29 18.43H14.14L20.57 12V2M19.14 11.29L16.29 14.14H13.43L10.93 16.64V14.14H7.71V3.43H19.14Z" fill="white"/></svg>
      <div class="card-info">
        <div class="card-name">${s.name}</div>
        <div class="card-handle">@${s.handle}</div>
      </div>
    `;
    card.onclick = () => openViewer(i);
    g.appendChild(card);
  });
}

let currentIdx = -1;

function openViewer(i) {
  const s = STREAMERS[i];
  currentIdx = i;

  document.getElementById('vTitle').textContent   = s.name;
  document.getElementById('vHandle').textContent  = '@' + s.handle + (s.twitch ? ' · twitch.tv/' + s.twitch : '');

  // loader
  const frame  = document.getElementById('vFrame');
  const loader = document.getElementById('vLoader');
  frame.style.display = 'none';
  loader.style.display = 'flex';

  if (s.twitch) {
    frame.src = `https://player.twitch.tv/?channel=${encodeURIComponent(s.twitch)}&parent=${location.hostname||'localhost'}&muted=false&autoplay=true`;
    frame.onload = () => { loader.style.display='none'; frame.style.display='block'; };
  } else {
    // placeholder — show demo message
    setTimeout(() => {
      loader.innerHTML = `
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="opacity:.3"><path d="M11.64 5.93H13.07V10.21H11.64M15.57 5.93H17V10.21H15.57M7 2L3.43 5.57V18.43H7.71V22L11.29 18.43H14.14L20.57 12V2M19.14 11.29L16.29 14.14H13.43L10.93 16.64V14.14H7.71V3.43H19.14Z" fill="white"/></svg>
        <div style="font-family:'Oswald',sans-serif;font-size:16px;font-weight:700;letter-spacing:2px;color:#fff;margin-top:8px">${s.name}</div>
        <div style="font-size:11px;color:#6a738a;margin-top:4px;letter-spacing:1px">@${s.handle}</div>
        <div style="margin-top:16px;background:rgba(208,2,27,.15);border:1px solid rgba(208,2,27,.4);color:#D0021B;font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:2px;padding:6px 16px;border-radius:20px">СКОРО В ЭФИРЕ · 20 МАРТА</div>
      `;
    }, 800);
  }

  // footer chips
  const row = document.getElementById('footerRow');
  row.innerHTML = '';
  STREAMERS.forEach((st, idx) => {
    if (idx === i) return;
    const chip = document.createElement('div');
    chip.className = 'footer-chip';
    chip.innerHTML = `<div class="fav">${initials(st.name)}</div><div class="fn">${st.name.split(' ')[0]}</div>`;
    chip.onclick = () => openViewer(idx);
    row.appendChild(chip);
  });

  document.getElementById('viewer').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeViewer() {
  document.getElementById('viewer').classList.remove('open');
  document.getElementById('vFrame').src = '';
  document.getElementById('vFrame').style.display = 'none';
  const loader = document.getElementById('vLoader');
  loader.style.display = 'flex';
  loader.innerHTML = `<div class="loader-spin"></div><div class="loader-text">ЗАГРУЗКА СТРИМА...</div>`;
  document.body.style.overflow = '';
  currentIdx = -1;
}

buildGrid();
</script>
</body>
</html>
